name: One-time audited site fixes

on:
  push:
    paths:
      - .github/workflows/one-time-site-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fix homepage cumulative return unit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          old = '<div class="value" data-counter="144.5" data-decimals="1">144.5</div>'
          new = '<div class="value"><span data-counter="144.5" data-decimals="1">144.5</span><span class="unit">%</span></div>'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git add docs/index.html
          git commit -m "Fix homepage cumulative return unit"

      - name: Align public reproducibility claims
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          replacements = {
              '<h2 class="section-headline fade-up delay-1">Reproducible from<br>a single command.</h2>': '<h2 class="section-headline fade-up delay-1">Documented from<br>a frozen research run.</h2>',
              '<span class="path">~/walk-forward-crypto</span>': '<span class="path">private research pipeline</span>',
              '<span class="comment"># Fetch data, fit, walk-forward, render</span>': '<span class="comment"># Reference command from the private research pipeline</span>',
              '        markets. Built by Tomi Seregi. Source code, full methodology, and\n        reproducible pipeline available on GitHub.': '        markets. Built by Tomi Seregi. Public methodology, results, and\n        redaction details are available on GitHub.',
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git add docs/index.html
          git commit -m "Align homepage claims with public mirror"

      - name: Add homepage canonical and social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          needle = '<meta name="description" content="A walk-forward optimization framework for crypto markets. Signals validated out-of-sample, execution simulated under realistic frictions.">\n'
          insert = needle + '<link rel="canonical" href="https://akzar1el.github.io/walk-forward-crypto/">\n<meta property="og:type" content="website">\n<meta property="og:title" content="Walk-Forward Crypto — Adaptive Out-of-Sample Trading System">\n<meta property="og:description" content="A walk-forward optimization framework for crypto markets. Signals validated out-of-sample, execution simulated under realistic frictions.">\n<meta property="og:url" content="https://akzar1el.github.io/walk-forward-crypto/">\n<meta property="og:image" content="https://akzar1el.github.io/walk-forward-crypto/assets/equity_curve.png">\n<meta name="twitter:card" content="summary_large_image">\n'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, insert))
          PY
          git add docs/index.html
          git commit -m "Add homepage canonical and social metadata"

      - name: Link technical documentation from homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          needle = '        <li><a href="interactive/dashboard.html">Equity dashboard</a></li>\n'
          insert = needle + '        <li><a href="NUMBERS_LEDGER.html">Numbers ledger</a></li>\n        <li><a href="REDACTION_REPORT.html">Redaction report</a></li>\n'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, insert))
          PY
          git add docs/index.html
          git commit -m "Link technical documentation from homepage"

      - name: Add dashboard search and social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/interactive/dashboard.html')
          s = p.read_text()
          needle = '<title>Walk-Forward Crypto — OOS Dashboard</title>\n'
          insert = needle + '<meta name="description" content="Interactive out-of-sample performance dashboard for the BTC/ETH walk-forward crypto research system, including equity, drawdown, yearly returns, and per-asset attribution.">\n<link rel="canonical" href="https://akzar1el.github.io/walk-forward-crypto/interactive/dashboard.html">\n<meta property="og:type" content="website">\n<meta property="og:title" content="Walk-Forward Crypto — OOS Dashboard">\n<meta property="og:description" content="Interactive out-of-sample performance dashboard for the BTC/ETH walk-forward crypto research system.">\n<meta property="og:url" content="https://akzar1el.github.io/walk-forward-crypto/interactive/dashboard.html">\n<meta property="og:image" content="https://akzar1el.github.io/walk-forward-crypto/assets/equity_curve.png">\n<meta name="twitter:card" content="summary_large_image">\n'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, insert))
          PY
          git add docs/interactive/dashboard.html
          git commit -m "Add dashboard search and social metadata"

      - name: Add equity page metadata and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/interactive/equity.html')
          s = p.read_text(encoding='utf-8-sig')
          assert s.startswith('<!DOCTYPE html>\n<html><head>')
          s = s.replace('<!DOCTYPE html>\n<html><head><meta charset="utf-8">', '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8">', 1)
          needle = '<title>Walk-forward system — interactive results</title>\n'
          insert = needle + '<meta name="description" content="Interactive out-of-sample equity, drawdown, and weekly signal-family charts for the BTC/ETH walk-forward crypto research system.">\n<link rel="canonical" href="https://akzar1el.github.io/walk-forward-crypto/interactive/equity.html">\n<meta property="og:type" content="website">\n<meta property="og:title" content="Walk-Forward Crypto — Interactive OOS Results">\n<meta property="og:description" content="Interactive out-of-sample equity, drawdown, and weekly signal-family charts for the BTC/ETH walk-forward crypto research system.">\n<meta property="og:url" content="https://akzar1el.github.io/walk-forward-crypto/interactive/equity.html">\n<meta name="twitter:card" content="summary">\n'
          assert s.count(needle) == 1
          s = s.replace(needle, insert)
          needle = 'Educational only — not investment advice.</div>'
          insert = 'Educational only — not investment advice. · <a href="../index.html">Project overview</a> · <a href="./dashboard.html">Full dashboard</a></div>'
          assert s.count(needle) == 1
          s = s.replace(needle, insert)
          needle = 'padding:6px 12px}</style>'
          insert = 'padding:6px 12px}.note a{color:#58a6ff;text-decoration:none}.note a:hover{text-decoration:underline}</style>'
          assert s.count(needle) == 1
          s = s.replace(needle, insert)
          p.write_text(s, encoding='utf-8')
          PY
          git add docs/interactive/equity.html
          git commit -m "Add equity page metadata and navigation"

      - name: Install image optimizer
        run: python -m pip install --quiet pillow

      - name: Optimize favicon payload
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('docs/assets/favicon.png')
          im = Image.open(p)
          im.thumbnail((192, 192), Image.Resampling.LANCZOS)
          assert im.size == (192, 192)
          im.save(p, optimize=True, compress_level=9)
          PY
          git add docs/assets/favicon.png
          git commit -m "Optimize favicon payload"

      - name: Optimize navigation logo payload
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('docs/assets/brand_logo.png')
          im = Image.open(p)
          im.thumbnail((320, 320), Image.Resampling.LANCZOS)
          assert im.size[0] == 320
          im.save(p, optimize=True, compress_level=9)
          PY
          git add docs/assets/brand_logo.png
          git commit -m "Optimize navigation logo payload"

      - name: Serve hero background as WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('docs/assets/hero_background.png')
          out = Path('docs/assets/hero_background.webp')
          Image.open(p).convert('RGB').save(out, 'WEBP', quality=85, method=6)
          for rel in ['docs/index.html', 'docs/interactive/dashboard.html']:
              f = Path(rel)
              s = f.read_text()
              assert s.count('hero_background.png') == 1
              f.write_text(s.replace('hero_background.png', 'hero_background.webp'))
          p.unlink()
          PY
          git add docs/assets/hero_background.webp docs/assets/hero_background.png docs/index.html docs/interactive/dashboard.html
          git commit -m "Serve hero background as WebP"

      - name: Push audited commits
        run: git push origin HEAD:main
