name: One-time internal linking sweep

on:
  push:
    paths:
      - .github/workflows/one-time-internal-link-sweep.yml

permissions:
  contents: write

jobs:
  link-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add contextual metric provenance on overview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          old = '''      Every metric below is computed on the contiguous out-of-sample equity
      curve. In-sample numbers are kept in the diagnostic logs — never on this
      page. Open the interactive dashboard for the full equity curve, drawdown
      profile, and per-asset attribution.'''
          new = '''      Every metric below is computed on the contiguous out-of-sample equity
      curve. In-sample numbers are kept in the diagnostic logs — never on this
      page. Source provenance for every published figure is in the
      <a href="NUMBERS_LEDGER.html" style="color: var(--accent); text-decoration: none;">numbers ledger</a>.
      Open the interactive dashboard for the full equity curve, drawdown
      profile, and per-asset attribution.'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git add docs/index.html
          git commit -m "Link overview metrics to numbers ledger"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Add dashboard provenance links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/interactive/dashboard.html')
          s = p.read_text()
          old1 = '''      <strong>Headline performance:</strong> +144.5% over Jan 2024 to Jun 2026 (+44.2%/yr, Sharpe 1.20 +/- 0.64) vs +46.0% for holding BTC, paper-traded net of costs and funding.
    </p>'''
          new1 = '''      <strong>Headline performance:</strong> +144.5% over Jan 2024 to Jun 2026 (+44.2%/yr, Sharpe 1.20 +/- 0.64) vs +46.0% for holding BTC, paper-traded net of costs and funding. Every published figure is traceable in the <a href="../NUMBERS_LEDGER.html" style="color: var(--accent); text-decoration: none;">numbers ledger</a>.
    </p>'''
          old2 = '''        Weekly picks shown at signal-family level only.
      </p>'''
          new2 = '''        Weekly picks shown at signal-family level only; the <a href="../REDACTION_REPORT.html" style="color: var(--text-dim);">redaction report</a> explains what is intentionally withheld.
      </p>'''
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          git add docs/interactive/dashboard.html
          git commit -m "Link dashboard claims to provenance docs"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Link interactive chart to source ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/interactive/equity.html')
          s = p.read_text()
          old = '''Educational only — not investment advice. · <a href="../">Project overview</a> · <a href="./dashboard.html">Full dashboard</a></div>'''
          new = '''Educational only — not investment advice. · <a href="../">Project overview</a> · <a href="./dashboard.html">Full dashboard</a> · <a href="../NUMBERS_LEDGER.html">Numbers ledger</a></div>'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git add docs/interactive/equity.html
          git commit -m "Link interactive chart to numbers ledger"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Add related navigation to numbers ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/NUMBERS_LEDGER.md')
          s = p.read_text()
          old = '''# Numbers ledger — ground truth for every published figure

Every number in the case study (README.md) traces to one of three sources'''
          new = '''# Numbers ledger — ground truth for every published figure

Related: [Project overview](https://akzar1el.github.io/walk-forward-crypto/) · [OOS dashboard](https://akzar1el.github.io/walk-forward-crypto/interactive/dashboard.html) · [Redaction report](https://akzar1el.github.io/walk-forward-crypto/REDACTION_REPORT.html)

Every number in the case study (README.md) traces to one of three sources'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git add docs/NUMBERS_LEDGER.md
          git commit -m "Cross-link numbers ledger to related pages"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Add related navigation to redaction report
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/REDACTION_REPORT.md')
          s = p.read_text()
          old = '''# Redaction report

What the case study abstracts, what it keeps, and how this public'''
          new = '''# Redaction report

Related: [Project overview](https://akzar1el.github.io/walk-forward-crypto/) · [Numbers ledger](https://akzar1el.github.io/walk-forward-crypto/NUMBERS_LEDGER.html) · [OOS dashboard](https://akzar1el.github.io/walk-forward-crypto/interactive/dashboard.html)

What the case study abstracts, what it keeps, and how this public'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git add docs/REDACTION_REPORT.md
          git commit -m "Cross-link redaction report to related pages"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validate internal link graph
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'docs/index.html': ['href="NUMBERS_LEDGER.html"', 'href="interactive/dashboard.html"', 'href="REDACTION_REPORT.html"'],
              'docs/interactive/dashboard.html': ['href="../NUMBERS_LEDGER.html"', 'href="../REDACTION_REPORT.html"', 'href="./equity.html"', 'href="../"'],
              'docs/interactive/equity.html': ['href="../NUMBERS_LEDGER.html"', 'href="./dashboard.html"', 'href="../"'],
              'docs/NUMBERS_LEDGER.md': ['walk-forward-crypto/', 'interactive/dashboard.html', 'REDACTION_REPORT.html'],
              'docs/REDACTION_REPORT.md': ['walk-forward-crypto/', 'NUMBERS_LEDGER.html', 'interactive/dashboard.html'],
          }
          for name, needles in checks.items():
              text = Path(name).read_text()
              for needle in needles:
                  assert needle in text, (name, needle)
          for target in [
              'docs/index.html',
              'docs/interactive/dashboard.html',
              'docs/interactive/equity.html',
              'docs/NUMBERS_LEDGER.md',
              'docs/REDACTION_REPORT.md',
          ]:
              assert Path(target).is_file(), target
          print('Internal link graph invariants passed')
          PY

      - name: Remove helper workflow
        run: |
          git rm .github/workflows/one-time-internal-link-sweep.yml
          git commit -m "Remove one-time internal linking sweep workflow"
          git pull --rebase origin main
          git push origin HEAD:main
